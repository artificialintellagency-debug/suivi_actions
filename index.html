<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F3A">
<meta name="mobile-web-app-capable" content="yes">
<title>Suivi des cours</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --navy:#0B1F3A; --navy2:#10294A; --navy3:#16345C;
  --text:#EEF2F8; --muted:#8EA0BD; --line:rgba(255,255,255,.09);
  --gold:#C9A24B; --up:#3FCF8E; --down:#FF7266;
  --serif:Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--navy);color-scheme:dark}
body{font-family:var(--sans);color:var(--text);background:var(--navy);min-height:100dvh;
  padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums;
  max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

.top{position:sticky;top:0;z-index:5;background:var(--navy);
  padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px;border-bottom:1px solid var(--gold)}
.bar1{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:.2px;line-height:1.1}
#status{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.35;max-width:30ch}
#status.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--up);margin-right:6px;vertical-align:1px}
.icons{display:flex;gap:4px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.ib:active{background:var(--navy3);color:var(--text)}
.ib svg{width:22px;height:22px}
.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.periods{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:14px;
  background:var(--navy2);border-radius:12px;padding:4px}
.periods button{padding:9px 0;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);
  transition:background .15s,color .15s}
.periods button[aria-selected="true"]{background:var(--gold);color:var(--navy)}

.summary{display:grid;grid-template-columns:1fr 1.1fr 1.1fr;gap:0;margin:18px 18px 6px;
  border:1px solid var(--line);border-radius:14px;background:var(--navy2)}
.summary>div{padding:12px 10px 12px 12px;min-width:0}
.summary>div+div{border-left:1px solid var(--line)}
.summary small{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.summary strong{display:block;font-family:var(--serif);font-size:19px;line-height:1.1;white-space:nowrap}
.summary em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.listhead{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 6px;
  font-size:13px;color:var(--muted)}
#sort{padding:6px 10px;border-radius:8px;color:var(--text);background:var(--navy2);font-size:13px}

ul{list-style:none}
li{border-bottom:1px solid var(--line)}
.row{width:100%;display:grid;grid-template-columns:1fr auto 98px;column-gap:12px;align-items:center;
  padding:13px 20px 12px;text-align:left}
.row:active{background:var(--navy2)}
.id{min-width:0}
.id b{display:block;font-size:17px;letter-spacing:.3px}
.id small{display:block;font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.px{font-size:16px;text-align:right}
.chg{justify-self:stretch;text-align:right;font-size:14px;font-weight:700;padding:6px 8px;border-radius:8px}
.up{color:var(--up);background:rgba(63,207,142,.12)}
.down{color:var(--down);background:rgba(255,114,102,.12)}
.nd{color:var(--muted);background:transparent;font-weight:400;font-style:italic}
.bar{grid-column:1/-1;height:3px;border-radius:3px;background:rgba(255,255,255,.05);margin-top:11px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .35s ease}
.bar .up{background:var(--up)} .bar .down{background:var(--down)}

.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.detail[data-open="true"]{grid-template-rows:1fr}
.detail>div{overflow:hidden}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);margin:2px 20px 16px;
  border:1px solid var(--line);border-radius:12px;overflow:hidden}
.grid>div{background:var(--navy2);padding:10px 12px}
.grid small{display:block;font-size:12px;color:var(--muted)}
.grid span{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:4px;font-size:14px}
.grid b{font-size:13px}
.grid b.up,.grid b.down{background:none}

.empty{padding:28px 24px;color:var(--muted);font-size:14px;line-height:1.5}

dialog{margin:auto auto 0;width:100%;max-width:560px;border:0;border-radius:20px 20px 0 0;
  background:var(--navy2);color:var(--text);padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
dialog::backdrop{background:rgba(3,10,22,.65)}
dialog h2{font-family:var(--serif);font-size:20px;margin-bottom:8px}
dialog p{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:14px}
dialog label{display:block;font-size:13px;margin-bottom:6px}
dialog input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--navy);
  color:var(--text);font:inherit;font-size:14px}
.btns{display:flex;gap:10px;margin-top:16px}
.btns button{flex:1;padding:12px;border-radius:10px;font-weight:600;background:var(--navy3)}
.btns .main{background:var(--gold);color:var(--navy)}
#install{display:none;width:100%;margin-top:12px;padding:12px;border-radius:10px;border:1px solid var(--gold);color:var(--gold);font-weight:600}
#err{color:var(--down);font-size:13px;margin-top:8px;min-height:1em}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="bar1">
    <div>
      <h1>Suivi des cours</h1>
      <p id="status" aria-live="polite"></p>
    </div>
    <div class="icons">
      <button class="ib" id="refresh" aria-label="Actualiser les cours">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
      <button class="ib" id="gear" aria-label="Réglages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </div>
  <div class="periods" role="tablist" aria-label="Période">
    <button role="tab" data-k="d1" aria-selected="true">1 jour</button>
    <button role="tab" data-k="m6" aria-selected="false">6 mois</button>
    <button role="tab" data-k="y1" aria-selected="false">1 an</button>
    <button role="tab" data-k="y3" aria-selected="false">3 ans</button>
  </div>
</header>

<section class="summary" aria-label="Synthèse">
  <div><small>Moyenne</small><strong id="s-avg">–</strong><em>&nbsp;</em></div>
  <div><small>Meilleur</small><strong id="s-best">–</strong><em id="s-best-t">&nbsp;</em></div>
  <div><small>Moins bon</small><strong id="s-worst">–</strong><em id="s-worst-t">&nbsp;</em></div>
</section>

<div class="listhead">
  <span id="count"></span>
  <button id="sort" aria-label="Changer le tri">Tri : performance</button>
</div>
<ul id="list"></ul>

<dialog id="dlg">
  <h2>Réglages</h2>
  <p>Colle ici le lien CSV de ton Google Sheet pour afficher les cours en direct. Dans Google Sheets : Fichier, Partager, Publier sur le web, puis choisis le format CSV.</p>
  <label for="url">Lien CSV</label>
  <input id="url" type="url" inputmode="url" placeholder="https://docs.google.com/spreadsheets/d/e/…/pub?output=csv" autocomplete="off">
  <div id="err" role="alert"></div>
  <div class="btns">
    <button id="cancel">Annuler</button>
    <button id="save" class="main">Enregistrer</button>
  </div>
  <button id="install">Installer l'appli sur l'écran d'accueil</button>
</dialog>

<script>
const SNAPSHOT = [["ETN", "Eaton", 425.49, 431.33, 403.36, 375.37, 199.64], ["EXEL", "Exelixis", 59.73, 58.44, 44.96, 38.44, 19.61], ["FSLR", "First Solar", 178.98, 180.13, 200.35, 226.15, 155.9], ["PAVE", "Global X U.S. Infrastructure Development ETF", 49.54, 49.67, 50.67, 43.9, 26.45], ["AINF", "iShares AI Infrastructure UCITS ETF", 20.97, 20.97, null, null, null], ["SEMI", "iShares MSCI Global Semiconductor ETF", 40.95, 41.16, 32.27, 31.71, 18.37], ["MRVL", "Marvell Technology", 272.38, 284.68, 131.3, 89.39, 49.49], ["NBIS", "Nebius NV", 219.74, 237.15, 154.56, 135.46, null], ["POWL", "Powell Industries", 191.61, 197.74, 228.99, 105.33, 24.7], ["PRY", "Prysmian", 122.3, 124.3, 119.7, 88.62, 34.62], ["RKLB", "Rocket Lab", 68.59, 71.92, 70.62, 65.42, 4.14], ["NOW", "ServiceNow Inc", 138.8, 137.87, 89.06, 184.74, 110.88], ["SKHY", "SK hynix", 170.21, 178.25, null, null, null], ["SPCX", "SpaceX", 161.97, 167.6, null, null, null], ["VRT", "Vertiv Holdings Co", 244, 246.49, 299.96, 179, 39.03], ["VST", "Vistra Energy", 157.32, 166.72, 158.2, 209.55, 32.7]];
const PERIODS = [
  {k:'d1', label:'1 jour'}, {k:'m6', label:'6 mois'}, {k:'y1', label:'1 an'}, {k:'y3', label:'3 ans'}
];
const $ = id => document.getElementById(id);
const store = {
  get:(k,d=null)=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},
  del:k=>{try{localStorage.removeItem(k)}catch(e){}}
};

let state = { data: [], period: store.get('period','d1'), sort: store.get('sort','perf'), open: null };
if (!PERIODS.some(p=>p.k===state.period)) state.period='d1';

/* ---------- format ---------- */
const nf1 = new Intl.NumberFormat('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1});
const nf2 = new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtPct = v => v==null ? 'n/d' : (Math.abs(v)<0.0005 ? '0,0 %' : (v>0?'▲ ':'▼ ')+nf1.format(Math.abs(v)*100)+' %');
const fmtPx  = v => v==null ? 'n/d' : nf2.format(v);
const cls    = v => v==null ? 'nd' : (v>0.0005?'up':(v<-0.0005?'down':'nd'));
const esc    = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- données ---------- */
const fromRows = rows => rows.map(r=>({t:r[0], n:r[1], cur:r[2], old:{d1:r[3], m6:r[4], y1:r[5], y3:r[6]}}));
const perf = (it,k) => (it.cur!=null && it.old[k]!=null && it.old[k]!==0) ? (it.cur-it.old[k])/it.old[k] : null;

function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++} else q=false } else cell+=c }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell='' }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell='' }
    else cell+=c;
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row) }
  return rows;
}
function num(s){
  if(s==null) return null;
  s=String(s).trim();
  if(!s || /^(n\/?d|#.*|-+|—)$/i.test(s)) return null;
  s=s.replace(/[\s\u00a0\u202f$€£%]/g,'');
  if(s.includes(',')&&s.includes('.')){
    s = s.lastIndexOf(',')>s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  } else if(s.includes(',')) s=s.replace(',','.');
  const v=parseFloat(s); return isFinite(v)?v:null;
}
function parseSheet(text){
  const rows=parseCSV(text);
  const h=rows.findIndex(r=>(r[0]||'').trim().toLowerCase()==='ticker');
  if(h<0) throw new Error('En-tête « Ticker » introuvable');
  const head=rows[h].map(x=>(x||'').toLowerCase());
  const find=(re,d)=>{const i=head.findIndex(x=>re.test(x));return i<0?d:i};
  const c={ cur:find(/actuel/,2), d1:find(/24\s*h/,3), m6:find(/il y a 6/,5), y1:find(/il y a 1 an/,7), y3:find(/il y a 3/,9) };
  const out=[];
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i], t=(r[0]||'').trim();
    if(!t) break;
    out.push([t,(r[1]||'').trim(),num(r[c.cur]),num(r[c.d1]),num(r[c.m6]),num(r[c.y1]),num(r[c.y3])]);
  }
  if(!out.length) throw new Error('Aucune ligne de cours');
  return out;
}

const hhmm = d => d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const when = ts => { const d=new Date(ts), now=new Date();
  return d.toDateString()===now.toDateString() ? 'à '+hhmm(d) : 'le '+d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' à '+hhmm(d) };

function setStatus(msg, live){ const s=$('status'); s.textContent=msg; s.className=live?'live':'' }

async function load(){
  const url=store.get('csvUrl');
  $('refresh').classList.add('spin');
  try{
    if(!url){
      state.data=fromRows(SNAPSHOT);
      setStatus('Données intégrées. Ajoute ton lien CSV dans les réglages pour les cours en direct.');
    } else {
      const res=await fetch(url+(url.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const rows=parseSheet(await res.text());
      const ts=Date.now();
      store.set('last',JSON.stringify({ts,rows}));
      state.data=fromRows(rows);
      store.set('lastLoad',String(ts));
      setStatus('En direct, mis à jour '+when(ts),true);
    }
  }catch(e){
    const last=JSON.parse(store.get('last','null')||'null');
    if(last){ state.data=fromRows(last.rows); setStatus('Hors ligne ou lien illisible. Derniers cours reçus '+when(last.ts)+'.') }
    else { state.data=fromRows(SNAPSHOT); setStatus('Lien CSV illisible, données intégrées affichées.') }
  }
  $('refresh').classList.remove('spin');
  render();
}

/* ---------- affichage ---------- */
function render(){
  const k=state.period;
  document.querySelectorAll('.periods button').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===k));
  const items=state.data.map(it=>({it,p:perf(it,k)}));
  const nums=items.filter(x=>x.p!=null);

  const avg=nums.length?nums.reduce((a,x)=>a+x.p,0)/nums.length:null;
  const best=nums.reduce((a,x)=>!a||x.p>a.p?x:a,null);
  const worst=nums.reduce((a,x)=>!a||x.p<a.p?x:a,null);
  const set=(id,v,t)=>{const e=$(id);e.textContent=fmtPct(v);e.className=cls(v)==='nd'?'':cls(v);e.style.background='none'};
  set('s-avg',avg); set('s-best',best&&best.p); set('s-worst',worst&&worst.p);
  $('s-best-t').textContent=best?best.it.t:'\u00a0'; $('s-worst-t').textContent=worst?worst.it.t:'\u00a0';

  if(state.sort==='perf') items.sort((a,b)=>(a.p==null)-(b.p==null)||(b.p??0)-(a.p??0));
  else items.sort((a,b)=>a.it.t.localeCompare(b.it.t));
  $('sort').textContent=state.sort==='perf'?'Tri : performance':'Tri : A à Z';
  $('count').textContent=items.length+' titres';

  const maxAbs=Math.max(0.0001,...nums.map(x=>Math.abs(x.p)));
  $('list').innerHTML=items.map(({it,p})=>{
    const w=p==null?0:Math.max(3,Math.sqrt(Math.abs(p)/maxAbs)*100);
    const open=state.open===it.t;
    const cells=PERIODS.map(pp=>{const v=perf(it,pp.k);
      return `<div><small>Il y a ${pp.label}</small><span>${fmtPx(it.old[pp.k])}<b class="${cls(v)}">${fmtPct(v)}</b></span></div>`}).join('');
    return `<li>
      <button class="row" data-t="${esc(it.t)}" aria-expanded="${open}">
        <span class="id"><b>${esc(it.t)}</b><small>${esc(it.n)}</small></span>
        <span class="px">${fmtPx(it.cur)}</span>
        <span class="chg ${cls(p)}">${fmtPct(p)}</span>
        <span class="bar"><i class="${cls(p)}" style="width:${w}%"></i></span>
      </button>
      <div class="detail" data-open="${open}"><div><div class="grid">
        ${cells}
      </div></div></div>
    </li>`;
  }).join('') || '<li class="empty">Aucun cours à afficher.</li>';
}

/* ---------- interactions ---------- */
document.querySelector('.periods').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  state.period=b.dataset.k; store.set('period',state.period); render();
});
$('sort').addEventListener('click',()=>{ state.sort=state.sort==='perf'?'az':'perf'; store.set('sort',state.sort); render() });
$('list').addEventListener('click',e=>{
  const b=e.target.closest('.row'); if(!b) return;
  state.open = state.open===b.dataset.t ? null : b.dataset.t; render();
});
$('refresh').addEventListener('click',load);

const dlg=$('dlg');
$('gear').addEventListener('click',()=>{ $('url').value=store.get('csvUrl',''); $('err').textContent=''; dlg.showModal() });
$('cancel').addEventListener('click',()=>dlg.close());
$('save').addEventListener('click',()=>{
  const v=$('url').value.trim();
  if(v && !/^https:\/\//i.test(v)){ $('err').textContent='Le lien doit commencer par https://'; return }
  v ? store.set('csvUrl',v) : store.del('csvUrl');
  dlg.close(); load();
});
dlg.addEventListener('click',e=>{ if(e.target===dlg) dlg.close() });

let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferred=e; $('install').style.display='block' });
$('install').addEventListener('click',async()=>{ if(!deferred) return; deferred.prompt(); await deferred.userChoice; deferred=null; $('install').style.display='none' });

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && store.get('csvUrl') && Date.now()-Number(store.get('lastLoad','0'))>5*60*1000) load();
});

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
</script>
</body>
</html>
